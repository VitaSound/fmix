name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FMIX_HOME: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache GForth 0.7.9
        id: cache-gforth
        uses: actions/cache@v4
        with:
          path: ~/opt/gforth-0.7.9
          key: gforth-0.7.9-${{ runner.os }}-v2

      - name: Build and install GForth 0.7.9
        run: bash .github/scripts/build-gforth-0.7.9.sh

      - name: Verify GForth version
        run: gforth --version 2>&1 | grep -F '0.7.9'

      - name: fmix version
        run: FMIX_CMD=version gforth fmix.4th

      - name: fmix test
        run: FMIX_CMD=test gforth fmix.4th

      - name: fmix check (test only)
        run: fmix check --stage pre-commit --no-flint --no-fcov

      - uses: actions/checkout@v4
        with:
          repository: VitaSound/fcov
          ref: '0.3.0'
          path: fcov

      - name: Definition coverage
        env:
          FCOV_HOME: ${{ github.workspace }}/fcov
          PATH: ${{ github.workspace }}/fcov/bin:${{ env.PATH }}
        run: |
          fcov run env FMIX_CMD=test gforth fmix.4th
          pct=$(fcov report --format json | jq -r '.summary.coverage_pct')
          bash .github/scripts/update-cov-badge.sh . "$pct"
