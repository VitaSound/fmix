name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FMIX_HOME: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      # No actions/cache for /opt — prefix is hard-coded in the engine;
      # GHCR pull (~20MB) is fast enough without a host-side cache.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install GForth 0.7.9 (GHCR, else source build)
        run: bash .github/scripts/fetch-gforth-0.7.9.sh

      - name: Verify GForth version
        run: gforth --version 2>&1 | grep -F '0.7.9'

      - name: fmix version
        run: FMIX_CMD=version gforth fmix.4th

      - name: fmix test
        run: FMIX_CMD=test gforth fmix.4th

      - name: fmix check (test only)
        run: bash bin/fmix check --stage pre-commit --no-flint --no-fcov

      - uses: actions/checkout@v4
        with:
          repository: VitaSound/fcov
          ref: '0.3.0'
          path: fcov

      - name: Definition coverage
        env:
          FCOV_HOME: ${{ github.workspace }}/fcov
          PATH: ${{ github.workspace }}/fcov/bin:${{ env.PATH }}
        run: |
          fcov run env FMIX_CMD=test gforth fmix.4th
          pct=$(fcov report --format json | jq -r '.summary.coverage_pct')
          bash .github/scripts/update-cov-badge.sh . "$pct"
