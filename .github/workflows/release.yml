name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (must already exist on remote)
        required: true
        default: "0.4.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: FMix ${{ inputs.tag }}
          body_path: .github/RELEASE_NOTES_${{ inputs.tag }}.md
          draft: false
          prerelease: false
